{% extends 'base.html' %}

{% block title %}Register – Roy Mart{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 36px auto; padding: 0 16px;">
  <div style="background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);">
    <h1 style="margin-top: 0; font-size: 24px; text-align: center;">Create Roy Mart Account</h1>
    <form method="POST" action="{{ url_for('register') }}" style="display: grid; gap: 14px;">
      <div>
        <label style="display: block; font-weight: 600; margin-bottom: 5px;">Register As</label>
        <select name="role" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
          <option value="customer">Customer (Shop & Order)</option>
          <option value="seller">Seller (List & Sell Products)</option>
        </select>
      </div>

      <div>
        <label style="display: block; font-weight: 600; margin-bottom: 5px;">Full Name / Store Name</label>
        <input type="text" name="name" placeholder="Enter your name" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
      </div>

      <div>
        <label style="display: block; font-weight: 600; margin-bottom: 5px;">Email (Customers) or User ID (Sellers)</label>
        <input type="text" name="email" placeholder="e.g., user@example.com or seller101" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
      </div>

      <div>
        <label style="display: block; font-weight: 600; margin-bottom: 5px;">Password</label>
        <input type="password" name="password" placeholder="Create password" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
      </div>

      <div>
        <label style="display: block; font-weight: 600; margin-bottom: 5px;">Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Confirm password" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
      </div>

      <button type="submit" style="padding: 11px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">Register</button>
    </form>

    <p style="text-align: center; margin-top: 16px; font-size: 14px; color: #475569;">
      Already registered? <a href="{{ url_for('login') }}" style="color: #2563eb; font-weight: 600;">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
